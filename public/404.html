<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OBZERV</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // Converts a 404 into a redirect back to index.html, preserving the path
      // as a query string that the app can decode on load.
      var l = window.location;
      var base = '/OBZERV';
      var path = l.pathname.slice(base.length) || '/';
      var search = l.search;
      var hash = l.hash;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '/?p=' + encodeURIComponent(path + search) + hash
      );
    </script>
  </head>
  <body></body>
</html>
